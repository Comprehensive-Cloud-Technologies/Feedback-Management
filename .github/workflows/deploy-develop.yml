# ============================================================
#  DEPLOY → DEVELOPMENT  (develop branch → dev environment)
#
#  Triggered by:  push / merge to `develop`
#  No approval required — auto-deploys immediately
# ============================================================
name: Deploy → DEVELOPMENT

on:
  push:
    branches: [develop]

concurrency:
  group: development-deploy
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy Backend to Dev
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint PHP files
        run: |
          find cfs-backend-php -name "*.php" -not -path "*/vendor/*" | xargs -I {} php -l {}
          echo "✅ PHP syntax OK"

      - name: Create development .env
        run: |
          cat > cfs-backend-php/.env << 'ENVEOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ENVIRONMENT=development
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          ENVEOF

      - name: FTP Deploy Backend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./cfs-backend-php/
          server-dir: ${{ secrets.HOSTINGER_DEPLOY_PATH_BACKEND }}/
          exclude: |
            **/.git*
            **/.env.example

  deploy-frontend:
    name: Build & Deploy Frontend to Dev
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cfs-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cfs-frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: cfs-frontend

      - name: Build for development
        run: npm run build
        working-directory: cfs-frontend
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.FRONTEND_URL }}/api

      - name: FTP Deploy Frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./cfs-frontend/dist/
          server-dir: ${{ secrets.HOSTINGER_DEPLOY_PATH_FRONTEND }}/
          exclude: |
            **/.git*
