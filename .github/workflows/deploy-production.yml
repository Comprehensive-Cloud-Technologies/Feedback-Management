# ============================================================
#  DEPLOY → PRODUCTION  (live site: feedback.catalystsolutions.eco)
#
#  Triggered by:  push / merge to `main`
#  Protection:    GitHub Environment "production" requires
#                 manual approval from repo owner before deploy
#  Concurrency:   Only one deploy at a time — never cancel in-flight
# ============================================================
name: Deploy → PRODUCTION

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─── Step 1: Deploy PHP Backend ──────────────────────────
  deploy-backend:
    name: Deploy PHP Backend to Hostinger
    runs-on: ubuntu-latest
    environment: production   # ← REQUIRES manual approval in GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from GitHub Secrets
        run: |
          cat > cfs-backend-php/.env << 'ENVEOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ENVIRONMENT=production
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          ENVEOF

      - name: Deploy Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./cfs-backend-php/
          server-dir: ${{ secrets.HOSTINGER_DEPLOY_PATH_BACKEND }}/
          exclude: |
            **/.git*
            **/.gitignore
            **/test*.php
            **/debug*.php
            **/diagnose*.php
            **/check-prod.php
            **/direct_migrate.php
            **/seed_branch_admins.php
            **/.env.example
            **/php-dev.ini
            **/README.md
            **/*.log

      - name: Run database migrations (if any)
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true   # Don't block deploy if SSH not available on shared hosting
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.HOSTINGER_DEPLOY_PATH_BACKEND }}
            php run_migrations.php

  # ─── Step 2: Build & Deploy Frontend ─────────────────────
  deploy-frontend:
    name: Build React & Deploy to Hostinger
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-backend   # wait for backend to be live first

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cfs-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cfs-frontend

      - name: Build for production
        run: npm run build
        working-directory: cfs-frontend
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.FRONTEND_URL }}/api

      - name: Deploy Frontend dist/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./cfs-frontend/dist/
          server-dir: ${{ secrets.HOSTINGER_DEPLOY_PATH_FRONTEND }}/
          exclude: |
            **/.git*

  # ─── Step 3: Post-deploy verification ────────────────────
  verify-deployment:
    name: Verify Live Site is Responding
    runs-on: ubuntu-latest
    needs: deploy-frontend
    environment: production

    steps:
      - name: Health check — API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.FRONTEND_URL }}/api/)
          echo "API response: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "404" ]; then
            echo "⚠️  API returned $STATUS — check manually"
          else
            echo "✅ API is responding"
          fi

      - name: Health check — Frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.FRONTEND_URL }})
          echo "Frontend response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️  Frontend returned $STATUS"
            exit 1
          fi
          echo "✅ Frontend is live"
