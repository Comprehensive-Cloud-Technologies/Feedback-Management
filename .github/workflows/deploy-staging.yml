# ============================================================
#  DEPLOY → STAGING  (testing branch → staging environment)
#
#  Triggered by:  push / merge to `testing`
#  Protection:    GitHub Environment "staging" — 1 reviewer approval
# ============================================================
name: Deploy → STAGING

on:
  push:
    branches: [testing]

concurrency:
  group: staging-deploy
  cancel-in-progress: true   # Staging: cancel older runs if new one queues

jobs:
  # ─── Frontend CI check first ─────────────────────────────
  ci-check:
    name: Quick CI Check before Staging Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cfs-frontend/package-lock.json

      - name: Install & type check
        working-directory: cfs-frontend
        run: |
          npm ci
          npx tsc --noEmit

      - name: PHP syntax check
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run PHP lint
        run: |
          find cfs-backend-php -name "*.php" -not -path "*/vendor/*" | xargs -I {} php -l {}

  # ─── Deploy Backend ───────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    needs: ci-check
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Create staging .env
        run: |
          cat > cfs-backend-php/.env << 'ENVEOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ENVIRONMENT=staging
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          ENVEOF

      - name: FTP Deploy Backend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./cfs-backend-php/
          server-dir: ${{ secrets.HOSTINGER_DEPLOY_PATH_BACKEND }}/
          exclude: |
            **/.git*
            **/test*.php
            **/debug*.php
            **/diagnose*.php
            **/.env.example
            **/README.md

  # ─── Deploy Frontend ──────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend to Staging
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cfs-frontend/package-lock.json

      - name: Install & Build
        working-directory: cfs-frontend
        run: |
          npm ci
          npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.FRONTEND_URL }}/api

      - name: FTP Deploy Frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./cfs-frontend/dist/
          server-dir: ${{ secrets.HOSTINGER_DEPLOY_PATH_FRONTEND }}/
          exclude: |
            **/.git*
